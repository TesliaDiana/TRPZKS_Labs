server {
    listen 80;

    location /health/ {
        return 404;
    }

    location = / {
        if ($http_accept ~* "text/html") {
            return 406;
        }
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}