version: '3.8'

services:
  # 1. База даних
  db:
    image: postgres:15-alpine
    container_name: inventory-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data  # Дані збережуться на диску
    networks:
      - custom-network

  # 2. Твій застосунок
  app:
    build: .
    container_name: inventory-app
    restart: always
    depends_on:
      - db
    environment:
      # Вказуємо параметри підключення (хост - це ім'я сервісу 'db')
      DB_HOST: db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: inventory
    networks:
      - custom-network

  # 3. Проксі-сервер
  nginx:
    image: nginx:alpine
    container_name: inventory-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - custom-network

# Окрема мережа для сервісів
networks:
  custom-network:
    driver: bridge

# Опис тому (Volume) для бази даних
volumes:
  pgdata: