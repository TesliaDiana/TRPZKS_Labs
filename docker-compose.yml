version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: inventory-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data 
    networks:
      - custom-network

  app:
    build: .
    container_name: inventory-app
    restart: always
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: inventory
    networks:
      - custom-network

  nginx:
    image: nginx:alpine
    container_name: inventory-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - custom-network

networks:
  custom-network:
    driver: bridge

volumes:
  pgdata: