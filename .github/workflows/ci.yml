name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

services:
  postgres:
    image: postgres:15
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    ports:
      - 5432:5432

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test -- --coverage

docker:
  needs: test
  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Build image
      run: docker build -t ghcr.io/TesliaDiana/mywebapp:latest .

    - name: Push image
      run: docker push ghcr.io/TesliaDiana/mywebapp:latest

  deploy:
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Deploy via SSH
        run: |
          ssh TesliaDiana@target-node "
            docker pull ghcr.io/TesliaDiana/mywebapp:latest &&
            systemctl restart mywebapp
          "