---
name: CI/CD Pipeline

on:
  push:
    branches: [lab1]
    tags: ['v*']
  pull_request:
    branches: [lab1]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .github/workflows/

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: mypassword123
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run tests with coverage
        env:
          DB_USER: myuser
          DB_PASSWORD: mypassword123
          DB_NAME: inventory
          DB_HOST: localhost
          DB_PORT: 5432
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":40}}'
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and Push image
        run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/mywebapp
          SHA_TAG=sha-${{ github.sha }}
          docker build -t $IMAGE_ID:latest -t $IMAGE_ID:$SHA_TAG .
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:$SHA_TAG
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
            docker tag $IMAGE_ID:latest $IMAGE_ID:stable
            docker tag $IMAGE_ID:latest $IMAGE_ID:$TAG_NAME
            docker push $IMAGE_ID:stable
            docker push $IMAGE_ID:$TAG_NAME
          fi

  deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Deploy Container
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/tesliadiana/mywebapp:latest
          docker stop mywebapp || true
          docker rm mywebapp || true
          docker run -d --name mywebapp \
            --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=5432 \
            -e DB_USER=myuser \
            -e DB_PASSWORD=mypassword123 \
            -e DB_NAME=inventory \
            ghcr.io/tesliadiana/mywebapp:latest
      - name: Verify Deployment
        run: |
          echo "Waiting for service..."
          sleep 15
          curl --fail http://localhost:8000 || exit 1
          curl --fail http://localhost:80 || exit 1
          echo "Success!"